name: Build NetShield 2 experimental
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      THEOS_REVISION: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
      SDK_SHA256: 5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
    steps:
      - uses: actions/checkout@v4
      - name: Set Theos path
        shell: bash
        run: printf 'THEOS=%s/netshield-theos\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install build tools
        run: brew install make ldid xz
      - name: Install pinned Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout "$THEOS_REVISION"
          git -C "$THEOS" submodule update --init --recursive
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/ios-sdk.tar.xz"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/ios-sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/ios-sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          git -C "$THEOS" rev-parse HEAD > "$RUNNER_TEMP/toolchain.txt"
          xcodebuild -version >> "$RUNNER_TEMP/toolchain.txt"
      - name: Validate sources and test policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py
          python3 Tests/validation_test.py
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            Tests/policy_test.m Shared/NSPolicy.m -o "$RUNNER_TEMP/policy_test"
          "$RUNNER_TEMP/policy_test"
          sh -n layout/DEBIAN/postinst
          sh -n layout/DEBIAN/prerm
      - name: Compile and package for rootless iOS
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          gmake clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/netshield-build.log"
          test -f packages/com.eolnmsuk.netshield_2.0.0~alpha1_iphoneos-arm64.deb
      - name: Verify signed entitlements
        shell: bash
        run: |
          set -euo pipefail
          app=.theos/_/var/jb/Applications/NetShield.app
          for component in NetShield PlugIns/NetShieldData.appex/NetShieldData PlugIns/NetShieldControl.appex/NetShieldControl; do
            ldid -e "$app/$component" > "$RUNNER_TEMP/entitlements.plist"
            python3 scripts/check_entitlements.py "$RUNNER_TEMP/entitlements.plist" "$component"
          done
      - name: Upload experimental deb
        uses: actions/upload-artifact@v4
        with:
          name: NetShield-2-experimental-iOS16-rootless
          path: packages/com.eolnmsuk.netshield_2.0.0~alpha1_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetShield-build-diagnostics
          path: |
            ${{ runner.temp }}/netshield-build.log
            ${{ runner.temp }}/toolchain.txt
          if-no-files-found: ignore
