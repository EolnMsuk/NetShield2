name: Build NetShield2
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide, rootful]
        include:
          - scheme: rootless
            theos_scheme: rootless
            theos_repository: theos/theos
            theos_revision: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
            package_arch: iphoneos-arm64
            app_path: .theos/_/var/jb/Applications/NetShield2.app
          - scheme: roothide
            theos_scheme: roothide
            theos_repository: roothide/theos
            theos_revision: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
            package_arch: iphoneos-arm64e
            app_path: .theos/_/Applications/NetShield2.app
          - scheme: rootful
            theos_scheme: ""
            theos_repository: theos/theos
            theos_revision: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
            package_arch: iphoneos-arm
            app_path: .theos/_/Applications/NetShield2.app
    env:
      THEOS_REPOSITORY: ${{ matrix.theos_repository }}
      THEOS_REVISION: ${{ matrix.theos_revision }}
      PACKAGE_VARIANT: ${{ matrix.scheme }}
      THEOS_PACKAGE_SCHEME: ${{ matrix.theos_scheme }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      APP_PATH: ${{ matrix.app_path }}
      SDK_SHA256: 5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Read release metadata
        run: python3 scripts/sync_version.py --github-env "$GITHUB_ENV"
      - name: Set Theos path
        shell: bash
        run: printf 'THEOS=%s/netshield-theos\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install build tools
        run: brew install make ldid xz dpkg
      - name: Install pinned Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/$THEOS_REPOSITORY.git" "$THEOS"
          # A pinned commit may no longer belong to an advertised upstream branch.
          git -C "$THEOS" fetch origin "$THEOS_REVISION"
          git -C "$THEOS" checkout --detach "$THEOS_REVISION"
          git -C "$THEOS" submodule update --init --recursive
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/ios-sdk.tar.xz"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/ios-sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/ios-sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py --scheme "$PACKAGE_VARIANT"
          python3 scripts/test_packaging.py
          python3 scripts/test_signing_identity.py
          python3 scripts/test_macho.py
          node scripts/test_prepare_draft.cjs
          sh -n layout/DEBIAN/postinst
          sh -n layout/DEBIAN/prerm
      - name: Check Objective-C formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/netshield-format"
          "$RUNNER_TEMP/netshield-format/bin/pip" install clang-format==19.1.7
          python3 scripts/check_format.py "$RUNNER_TEMP/netshield-format/bin/clang-format"
      - name: Run native regression tests
        run: python3 scripts/test.py
      - name: Run shared-code ASan and UBSan regressions
        if: matrix.scheme == 'rootless'
        run: python3 scripts/test.py --sanitizers address,undefined
      - name: Compile and package for ${{ matrix.scheme }} iOS
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          gmake clean
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME"
          source="packages/${PACKAGE_ID}_${PACKAGE_VERSION}_${PACKAGE_ARCH}.deb"
          destination="packages/${PACKAGE_ID}_${PACKAGE_VERSION}_${PACKAGE_VARIANT}.deb"
          test -f "$source"
          mv "$source" "$destination"
          test -f "$destination"
      - name: Verify built deb contents
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --raw-extract "packages/${PACKAGE_ID}_${PACKAGE_VERSION}_${PACKAGE_VARIANT}.deb" "$RUNNER_TEMP/netshield-package"
          python3 scripts/validate.py --stage "$RUNNER_TEMP/netshield-package" --scheme "$PACKAGE_VARIANT"
      - name: Verify signing identities and entitlements
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/netshield-package/${APP_PATH#.theos/_/}"
          for component in NetShield2 PlugIns/NetShield2Data.appex/NetShield2Data PlugIns/NetShield2Control.appex/NetShield2Control; do
            python3 scripts/check_macho.py "$app/$component"
            codesign --verify --strict --verbose=2 "$app/$component"
            python3 scripts/check_signing_identity.py "$app/$component"
            ldid -e "$app/$component" > "$RUNNER_TEMP/entitlements.plist"
            python3 scripts/check_entitlements.py "$RUNNER_TEMP/entitlements.plist" "$component"
          done
      - name: Record source, final package hashes and tool versions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py --package "packages/${PACKAGE_ID}_${PACKAGE_VERSION}_${PACKAGE_VARIANT}.deb" --source "$GITHUB_SHA" --scheme "$PACKAGE_VARIANT" --theos "$THEOS_REVISION" --sdk "$SDK_SHA256"
      - name: Upload validated deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetShield2-${{ env.PACKAGE_VERSION }}-iOS15-18-${{ matrix.scheme }}
          path: |
            packages/${{ env.PACKAGE_ID }}_${{ env.PACKAGE_VERSION }}_${{ matrix.scheme }}.deb
            packages/${{ env.PACKAGE_ID }}_${{ env.PACKAGE_VERSION }}_${{ matrix.scheme }}.deb.manifest.json
          if-no-files-found: error

  release:
    name: Prepare draft stable release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.repository }}-draft-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Read release metadata
        run: python3 scripts/sync_version.py --github-env "$GITHUB_ENV"
      - name: Download all three release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: NetShield2-${{ env.PACKAGE_VERSION }}-iOS15-18-*
          path: release-assets
          merge-multiple: true
      - name: Prepare the current version as a draft with deb assets
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const version = process.env.PACKAGE_VERSION;
            const packageId = process.env.PACKAGE_ID;
            if (!version || !packageId) throw new Error('Missing validated control metadata');
            const changelog = fs.readFileSync('changelog.md', 'utf8').replace(/\r\n?/g, '\n');
            const entry = changelog.split(/^# /m).find(section => section.startsWith(`${version}\n`));
            const body = entry?.slice(version.length).trim();
            if (!body) throw new Error(`Missing changelog entry for ${version}`);
            await require('./scripts/prepare_draft.cjs').prepareDraft({github, context, core,
              version, packageId, changelog: body});
