name: Phase 0 recovery PoC (manual, no release)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Phase 0 ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain-trollstore-poc
            scheme: ""
            repository: theos/theos
            revision: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          - variant: rootless-baseline
            scheme: rootless
            repository: theos/theos
            revision: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          - variant: roothide-baseline
            scheme: roothide
            repository: roothide/theos
            revision: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
    env:
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
      THEOS_REPOSITORY: ${{ matrix.repository }}
      THEOS_REVISION: ${{ matrix.revision }}
      VARIANT: ${{ matrix.variant }}
      SDK_SHA256: 5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb
    steps:
      - uses: actions/checkout@v4
      - name: Read metadata and set Theos path
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_version.py --github-env "$GITHUB_ENV"
          printf 'THEOS=%s/netshield-theos\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install build tools
        run: brew install make ldid xz dpkg
      - name: Install pinned Theos and SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/$THEOS_REPOSITORY.git" "$THEOS"
          git -C "$THEOS" fetch origin "$THEOS_REVISION"
          git -C "$THEOS" checkout --detach "$THEOS_REVISION"
          git -C "$THEOS" submodule update --init --recursive
          curl --fail --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/ios-sdk.tar.xz"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/ios-sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/ios-sdk.tar.xz" -C "$THEOS/sdks"
      - name: Source, archive fixture, and native regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py
          python3 scripts/test_packaging.py
          python3 scripts/test_signing_identity.py
          python3 scripts/test_tipa.py
          sh -n layout/DEBIAN/postinst
          sh -n layout/DEBIAN/prerm
          python3 scripts/test_uninstall.py --scheme rootless
          python3 scripts/test_uninstall.py --scheme roothide
          python3 scripts/test.py
      - name: Check Objective-C formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/netshield-format"
          "$RUNNER_TEMP/netshield-format/bin/pip" install clang-format==19.1.7
          python3 scripts/check_format.py "$RUNNER_TEMP/netshield-format/bin/clang-format"
      - name: Build isolated plain archive or legacy baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gmake clean THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME"
          if [ "$VARIANT" = plain-trollstore-poc ]; then
            # Empty standard scheme avoids both rootless and RootHide transforms.
            # Stage only: never package/register an additional /Applications app.
            gmake stage FINALPACKAGE=1 NETSHIELD_PLAIN_POC=1 THEOS_PACKAGE_SCHEME=
            app=.theos/_/Applications/NetShield2.app
            python3 scripts/build_tipa.py --app "$app" \
              --output "artifacts/NetShield2-${PACKAGE_VERSION}-phase0-plain.tipa"
            python3 scripts/check_tipa.py "artifacts/NetShield2-${PACKAGE_VERSION}-phase0-plain.tipa" \
              > artifacts/archive-audit.json
          else
            chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
            gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$THEOS_PACKAGE_SCHEME"
            if [ "$THEOS_PACKAGE_SCHEME" = rootless ]; then
              arch=iphoneos-arm64
              app=.theos/_/var/jb/Applications/NetShield2.app
            else
              arch=iphoneos-arm64e
              app=.theos/_/Applications/NetShield2.app
            fi
            cp "packages/${PACKAGE_ID}_${PACKAGE_VERSION}_${arch}.deb" \
              "artifacts/NetShield2-${PACKAGE_VERSION}-phase0-${VARIANT}.deb"
            dpkg-deb --raw-extract "artifacts/NetShield2-${PACKAGE_VERSION}-phase0-${VARIANT}.deb" \
              "$RUNNER_TEMP/package"
            python3 scripts/validate.py --stage "$RUNNER_TEMP/package" --scheme "$THEOS_PACKAGE_SCHEME"
          fi
          for component in NetShield2 PlugIns/NetShield2Data.appex/NetShield2Data PlugIns/NetShield2Control.appex/NetShield2Control; do
            python3 scripts/check_signing_identity.py "$app/$component"
            name=$(basename "$component")
            ldid -e "$app/$component" > "artifacts/${name}-entitlements.plist"
            python3 scripts/check_entitlements.py "artifacts/${name}-entitlements.plist" "$component"
            codesign -d --verbose=4 "$app/$component" 2> "artifacts/${name}-codesign.txt"
            otool -l "$app/$component" > "artifacts/${name}-load-commands.txt"
            otool -L "$app/$component" > "artifacts/${name}-dependencies.txt"
          done
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-revision.txt
          find artifacts -type f ! -name SHA256SUMS.txt -exec shasum -a 256 {} + > artifacts/SHA256SUMS.txt
      - name: Upload unqualified test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetShield2-Phase0-${{ matrix.variant }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
